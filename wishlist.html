<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameShelf - Lista de Desejos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>GameShelf 🎮</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="colecao.html">Coleção</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </header>

    <main>
        <h2>Adicionar à Lista de Desejos</h2>
        <form id="form-wishlist" onsubmit="adicionarWishlist(event)">
            <input type="text" id="w-titulo" placeholder="Título do Jogo" required>
            <input type="text" id="w-plataforma" placeholder="Plataforma de Desejo" required>
            <select id="w-prioridade" required>
                <option value="" disabled selected>Prioridade de Compra...</option>
                <option value="Alta">Alta 🔥</option>
                <option value="Média">Média ⏳</option>
                <option value="Baixa">Baixa 😴</option>
            </select>
            <button type="submit">Adicionar à Wishlist</button>
        </form>

        <h2>Jogos na Mira</h2>
        <div class="grid-jogos" id="container-wishlist"></div>
    </main>

    <script src="storage.js"></script>
    <script>
        function adicionarWishlist(event) {
            event.preventDefault();

            const novoDesejo = {
                id: gerarId(),
                titulo: document.getElementById('w-titulo').value,
                plataforma: document.getElementById('w-plataforma').value,
                prioridade: document.getElementById('w-prioridade').value
            };

            const lista = carregarDados(CHAVE_WISHLIST);
            lista.push(novoDesejo);
            salvarDados(CHAVE_WISHLIST, lista);

            document.getElementById('form-wishlist').reset();
            renderizarWishlist();
        }

        function removerWishlist(id) {
            let lista = carregarDados(CHAVE_WISHLIST);
            lista = lista.filter(item => item.id !== id);
            salvarDados(CHAVE_WISHLIST, lista);
            renderizarWishlist();
        }

        function renderizarWishlist() {
            const container = document.getElementById('container-wishlist');
            container.innerHTML = '';

            const lista = carregarDados(CHAVE_WISHLIST);

            if (lista.length === 0) {
                container.innerHTML = '<p>Sua lista de desejos está vazia.</p>';
                return;
            }

            lista.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${item.titulo}</h3>
                    <p><strong>Plataforma:</strong> ${item.plataforma}</p>
                    <p><strong>Prioridade:</strong> ${item.prioridade}</p>
                    <div class="acoes-card">
                        <button onclick="removerWishlist('${item.id}')" class="btn-excluir" style="width:100%;">Remover</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = renderizarWishlist;
    </script>
</body>
</html>
