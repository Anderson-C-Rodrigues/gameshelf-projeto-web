<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameShelf - Minha Coleção</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>GameShelf 🎮</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="colecao.html">Coleção</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </header>

    <main>
        <h2>Adicionar Novo Jogo (CRUD - Create)</h2>
        <!-- Requisito: Uso do evento onsubmit -->
        <form id="form-jogo" onsubmit="adicionarJogo(event)">
            <input type="text" id="titulo" placeholder="Título do Jogo" required>
            <input type="text" id="plataforma" placeholder="Plataforma (ex: PC, PS5, Switch)" required>
            <input type="number" id="nota" placeholder="Nota Pessoal (1 a 10)" min="1" max="10" required>
            <select id="status" required>
                <option value="" disabled selected>Status Atual...</option>
                <option value="Jogando">Jogando</option>
                <option value="Zerado">Zerado</option>
                <option value="Pausado">Pausado</option>
            </select>
            <button type="submit">Salvar Jogo na Coleção</button>
        </form>

        <div class="header-secao">
            <h2>Meus Jogos (CRUD - Read)</h2>
            <!-- Requisito: Uso do evento onchange -->
            <select id="filtro-status" onchange="renderizarColecao()">
                <option value="Todos">Todos os Status</option>
                <option value="Jogando">Jogando</option>
                <option value="Zerado">Zerado</option>
                <option value="Pausado">Pausado</option>
            </select>
        </div>

        <!-- Requisito: Manipulação intensa do DOM para renderizar elementos -->
        <div class="grid-jogos" id="container-jogos"></div>
    </main>

    <script src="storage.js"></script>
    <script>
        function adicionarJogo(event) {
            event.preventDefault();

            const novoJogo = {
                id: gerarId(),
                titulo: document.getElementById('titulo').value,
                plataforma: document.getElementById('plataforma').value,
                nota: document.getElementById('nota').value,
                status: document.getElementById('status').value
            };

            const jogos = carregarDados(CHAVE_JOGOS);
            jogos.push(novoJogo); // Manipulação de vetor (push)
            salvarDados(CHAVE_JOGOS, jogos);

            document.getElementById('form-jogo').reset();
            renderizarColecao();
        }

        // CRUD - Delete
        function excluirJogo(id) {
            if (confirm("Deseja realmente remover este jogo da sua coleção?")) {
                let jogos = carregarDados(CHAVE_JOGOS);
                jogos = jogos.filter(j => j.id !== id); // Manipulação de vetor (filter)
                salvarDados(CHAVE_JOGOS, jogos);
                renderizarColecao();
            }
        }

        function renderizarColecao() {
            const container = document.getElementById('container-jogos');
            container.innerHTML = '';

            let jogos = carregarDados(CHAVE_JOGOS);
            const filtro = document.getElementById('filtro-status').value;

            if (filtro !== 'Todos') {
                jogos = jogos.filter(j => j.status === filtro);
            }

            if (jogos.length === 0) {
                container.innerHTML = '<p>Nenhum jogo encontrado nesta categoria.</p>';
                return;
            }

            // Construção dinâmica de elementos no DOM
            jogos.forEach(jogo => {
                const card = document.createElement('div');
                card.className = 'card';

                card.innerHTML = `
                    <h3>${jogo.titulo}</h3>
                    <p><strong>Plataforma:</strong> ${jogo.plataforma}</p>
                    <p><strong>Nota:</strong> ${jogo.nota}/10</p>
                    <p><strong>Status:</strong> ${jogo.status}</p>
                    <div class="acoes-card">
                        <a href="detalhes.html?id=${jogo.id}" class="btn-detalhes">Reviews</a>
                        <button onclick="excluirJogo('${jogo.id}')" class="btn-excluir">Excluir</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = renderizarColecao;
    </script>
</body>
</html>
