<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameShelf - Detalhes & Reviews</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>GameShelf 🎮</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="colecao.html">Coleção</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </header>

    <main>
        <div id="dados-jogo-detalhe">
            <!-- Injetado por DOM baseado na URL Query String -->
        </div>

        <h2 style="margin-top:30px;">Minhas Anotações & Review</h2>
        <form onsubmit="salvarReview(event)">
            <textarea id="texto-review" placeholder="Escreva sua experiência, análises críticas, bugs encontrados ou diário de bordo sobre o jogo aqui..."></textarea>
            <button type="submit">Salvar Review do Jogo</button>
        </form>
    </main>

    <script src="storage.js"></script>
    <script>
        // Requisito: Comunicação entre interfaces passando dados/IDs por GET na URL
        const urlParams = new URLSearchParams(window.location.search);
        const jogoId = urlParams.get('id');

        function carregarDetalhesDoJogo() {
            const jogos = carregarDados(CHAVE_JOGOS);
            const jogo = jogos.find(j => j.id === jogoId);
            const container = document.getElementById('dados-jogo-detalhe');

            if (!jogo) {
                container.innerHTML = '<h2>Jogo não encontrado!</h2><a href="colecao.html">Voltar para a Coleção</a>';
                return;
            }

            container.innerHTML = `
                <h2 style="color: var(--secondary-color); font-size:2.2rem;">${jogo.titulo}</h2>
                <div class="card" style="margin-top:15px;">
                    <p><strong>Plataforma Utilizada:</strong> ${jogo.plataforma}</p>
                    <p><strong>Nota de Avaliação:</strong> ${jogo.nota} / 10</p>
                    <p><strong>Status de Progresso:</strong> ${jogo.status}</p>
                </div>
            `;

            // Carrega o review existente se houver
            const reviews = carregarDados(CHAVE_REVIEWS);
            const reviewExistente = reviews.find(r => r.jogoId === jogoId);
            if (reviewExistente) {
                document.getElementById('texto-review').value = reviewExistente.texto;
            }
        }

        function salvarReview(event) {
            event.preventDefault();
            const texto = document.getElementById('texto-review').value;
            let reviews = carregarDados(CHAVE_REVIEWS);

            // Remove review antigo para atualizar
            reviews = reviews.filter(r => r.jogoId !== jogoId);

            reviews.push({
                jogoId: jogoId,
                texto: texto
            });

            salvarDados(CHAVE_REVIEWS, reviews);
            alert('Review e notas atualizados com sucesso!');
        }

        window.onload = carregarDetalhesDoJogo;
    </script>
</body>
</html>
