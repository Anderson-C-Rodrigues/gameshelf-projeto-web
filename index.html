<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameShelf - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>GameShelf 🎮</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="colecao.html">Coleção</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="perfil.html">Perfil</a>
        </nav>
    </header>

    <main>
        <h2>Olá, <span id="nome-usuario">Jogador</span>!</h2>
        <p style="margin-bottom: 25px;">Aqui está o resumo em tempo real da sua biblioteca de jogos:</p>
        
        <div class="grid-jogos">
            <div class="card">
                <h3>Total na Coleção</h3>
                <p id="total-jogos" style="font-size: 2.5em; font-weight: bold; margin-top:10px;">0</p>
            </div>
            <div class="card">
                <h3>Média de Notas</h3>
                <p id="media-notas" style="font-size: 2.5em; font-weight: bold; margin-top:10px;">0.0</p>
            </div>
            <div class="card">
                <h3>Jogos Zerados</h3>
                <p id="total-zerados" style="font-size: 2.5em; font-weight: bold; margin-top:10px;">0</p>
            </div>
            <div class="card">
                <h3>Lista de Desejos</h3>
                <p id="total-wishlist" style="font-size: 2.5em; font-weight: bold; margin-top:10px;">0</p>
            </div>
        </div>
    </main>

    <script src="storage.js"></script>
    <script>
        function renderizarDashboard() {
            // Requisito: Manipulação de estruturas e vetores
            const jogos = carregarDados(CHAVE_JOGOS);
            const wishlist = carregarDados(CHAVE_WISHLIST);
            const perfil = localStorage.getItem(CHAVE_PERFIL);

            if (perfil) {
                document.getElementById('nome-usuario').innerText = JSON.parse(perfil).nome;
            }

            document.getElementById('total-jogos').innerText = jogos.length;
            document.getElementById('total-wishlist').innerText = wishlist.length;

            // Uso intensivo de métodos de array (filter e reduce)
            const zerados = jogos.filter(j => j.status === 'Zerado').length;
            document.getElementById('total-zerados').innerText = zerados;

            if (jogos.length > 0) {
                const somaNotas = jogos.reduce((acc, j) => acc + parseFloat(j.nota), 0);
                document.getElementById('media-notas').innerText = (somaNotas / jogos.length).toFixed(1);
            }
        }
        window.onload = renderizarDashboard;
    </script>
</body>
</html>
